[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ulitokauun-model_hot_swap_consistency_coverage_map"
version = "0.1.0"
description = "把候选项映射到类别上，算出工具调用协议工程师·模型热切换的一致性的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ulitokauun" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ulitokauun.github.io"
Repository = "https://github.com/ulitokauun/model_hot_swap_consistency_coverage_map"
Issues = "https://github.com/ulitokauun/model_hot_swap_consistency_coverage_map/issues"

[project.scripts]
model_hot_swap_consistency_coverage_map = "model_hot_swap_consistency_coverage_map:main"

[tool.setuptools]
py-modules = ["model_hot_swap_consistency_coverage_map"]
